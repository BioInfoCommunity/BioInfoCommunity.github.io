title: AlphaFold Education Summit Mexico 2025: Building a Learning Community
description: The AlphaFold Education Summit Mexico 2025 (AFESMX25) brought together students, educators and researchers to explore AlphaFold and artificial intelligence in the life sciences. Supported by EMBL-EBI, Google DeepMind, CICESE, the Mexican Bioinformatics Network (RMB), INER and Colegio Bourbaki, the event fostered knowledge exchange, strengthened collaborations and marked the beginning of a growing AlphaFold education community in Mexico.
