title: 3rd Latin American AlphaFold Workshop in Costa Rica
description: The Universidad de Costa Rica hosted the 3rd Latin American AlphaFold Workshop, with support from EMBL-EBI and Google DeepMind. The workshop brought together students and researchers from across Latin America for hands-on training in protein structure prediction, AlphaFold, molecular docking and therapeutic target identification. The event also provided an opportunity to strengthen regional connections and promote knowledge exchange in structural bioinformatics.
