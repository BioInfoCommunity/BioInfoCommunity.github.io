title: Strengthening AlphaFold Training Across Latin America
description: >-
  The first Latin American AlphaFold Workshop, hosted
  by Universidad de Costa Rica and led by José Arturo
  Molina Mora, brought together 20 early-career and
  senior researchers from Costa Rica, Nicaragua, Peru
  and Ecuador. Supported by EMBL-EBI and Google DeepMind,
  the workshop provided training in protein structure
  prediction, molecular docking and artificial
  intelligence. The event also encouraged knowledge
  exchange and strengthened regional connections
  within the AlphaFold education community.
