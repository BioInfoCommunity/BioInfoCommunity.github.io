title: Enhancing Structural Biology Skills: AlphaFold Workshop in India
description: >-
  ISCB RSG-India and EMBL-EBI organised a two-day
  hands-on AlphaFold workshop on 7–8 November 2025
  at the University of Delhi, India. The event brought
  together students and researchers to explore
  AI-driven protein structure prediction through
  practical sessions on AlphaFold, ColabFold, AlphaFold 3
  and molecular visualisation using PyMOL.
  Keynote presentations by Dinakar M. Salunke,
  Debasisa Mohanty and Martin Steinegger provided
  insights into advances in structural biology.
  The workshop encouraged knowledge exchange,
  practical skill development and stronger connections
  within India's structural bioinformatics community.
