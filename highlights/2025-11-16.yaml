title: "Building Capacity in Structural Biology: AlphaFold Workshop in Bangladesh"
description: >-
  A two-day hands-on workshop at the Bangladesh University
  of Engineering and Technology (BUET) brought together
  students and researchers to explore AI-driven structural
  biology tools, including AlphaFold, AlphaMissense,
  ESMFold and protein language models. Supported by
  EMBL-EBI and Google DeepMind, and organised in
  collaboration with The Bioscience Factory, ISCB
  RSG-Bangladesh and BUET, the workshop strengthened
  practical skills in structural bioinformatics.
  The programme also featured a Meet the Expert session
  with Sameer Velankar from EMBL-EBI's Protein Data Bank
  in Europe (PDBe), encouraging knowledge exchange
  and community connections.
